name: Retry standalone Profile Signal migration

on:
  push:
    branches:
      - feat/standalone-oss-migration
    paths:
      - .github/workflows/retry-standalone-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/standalone-oss-migration
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: mizzz-ivr/mizzz-ivr
          ref: 091cb5bfbe9d087360c144cc75f95b7547c2a023
          path: _source

      - name: Migrate OSS source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .profile-signal distribution docs release-notes scripts tests
          mkdir -p scripts tests docs/wiki

          cp -R _source/.profile-signal ./.profile-signal
          cp -R _source/distribution ./distribution
          cp -R _source/release-notes ./release-notes
          cp _source/scripts/build-profile-signal-release.py scripts/
          cp _source/tests/test_profile_signal.py tests/
          cp _source/tests/test_profile_signal_action.py tests/
          cp _source/tests/test_profile_signal_history.py tests/
          cp _source/tests/test_profile_signal_preset_registry.py tests/
          cp _source/tests/test_profile_signal_v02_presets.py tests/
          cp _source/.profile-signal/LICENSE LICENSE

          for page in Home Installation Configuration Presets License; do
            cp "_source/docs/wiki/${page}.md" "docs/wiki/${page}-ja.md"
          done

          cat > README.md <<'MD'
          # Profile Signal

          Modular, config-driven GitHub Profile README widgets generated from public GitHub activity.

          [日本語](./README.ja.md) · [Wiki](https://github.com/mizzz-ivr/profile-signal/wiki) · [Releases](https://github.com/mizzz-ivr/profile-signal/releases)

          Profile Signal turns a GitHub Profile README into a lightweight development dashboard while keeping the runtime inside your own profile repository.

          ## Widgets

          `LIVE SIGNAL` · `TODAY` · `CURRENT FOCUS` · `DEV PULSE` · `NOW BUILDING` · `ACTIVITY STREAM` · `DEV RECAP`

          ## Quick start

          1. Download `profile-signal-vX.Y.Z.zip` from [Releases](https://github.com/mizzz-ivr/profile-signal/releases).
          2. Extract it into `<username>/<username>`.
          3. Edit `.github/profile-signal.yml` and set your GitHub username.
          4. Commit and push.
          5. Run **Actions → Profile Signal → Run workflow** once.

          The installed workflow executes the local runtime:

          ```yaml
          - uses: ./.profile-signal
            with:
              config: .github/profile-signal.yml
          ```

          The default distribution is public-only and requires no PAT or API key.

          ## Presets

          `minimal` · `standard` · `full` · `terminal` · `compact` · `developer` · `activity` · `oss`

          Presets live in `.profile-signal/presets/*.yml`; explicit widget overrides take precedence.

          ## Development

          ```bash
          python -m pip install PyYAML==6.0.2
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/build-profile-signal-release.py --version v0.0.0-test
          ```

          The live profile at [github.com/mizzz-ivr](https://github.com/mizzz-ivr) is the primary dogfooding/showcase environment.

          ## License

          MIT. See [LICENSE](./LICENSE).
          MD

          cat > README.ja.md <<'MD'
          # Profile Signal

          公開GitHub Activityから、モジュール式のGitHub Profile README Widgetを自動生成するツールです。

          [English](./README.md) · [Wiki](https://github.com/mizzz-ivr/profile-signal/wiki) · [Releases](https://github.com/mizzz-ivr/profile-signal/releases)

          ## 主なWidget

          `LIVE SIGNAL` · `TODAY` · `CURRENT FOCUS` · `DEV PULSE` · `NOW BUILDING` · `ACTIVITY STREAM` · `DEV RECAP`

          ## 導入

          1. [Releases](https://github.com/mizzz-ivr/profile-signal/releases)から `profile-signal-vX.Y.Z.zip` をダウンロード
          2. `<username>/<username>` のrootへ展開
          3. `.github/profile-signal.yml` のusernameを変更
          4. commit / push
          5. **Actions → Profile Signal → Run workflow** を1回実行

          runtimeは利用者Repository内の `.profile-signal/` に入り、`uses: ./.profile-signal` で実行されます。

          標準構成はpublic-onlyで、PATやAPI Keyは不要です。

          ## Preset

          `minimal` · `standard` · `full` · `terminal` · `compact` · `developer` · `activity` · `oss`

          ## License

          MIT Licenseです。[LICENSE](./LICENSE)を参照してください。
          MD

          cat > docs/wiki/Home.md <<'MD'
          # Profile Signal

          [English](Home) | [日本語](Home-ja)

          Profile Signal generates modular GitHub Profile README widgets from public GitHub activity.

          - [Installation](Installation)
          - [Configuration](Configuration)
          - [Presets](Presets)
          - [License](License)

          Download the latest Release ZIP, extract it into your profile repository, configure your username, and run the included workflow.
          MD

          cat > docs/wiki/Installation.md <<'MD'
          # Installation

          [English](Installation) | [日本語](Installation-ja)

          1. Download `profile-signal-vX.Y.Z.zip` from [Releases](https://github.com/mizzz-ivr/profile-signal/releases).
          2. Extract it into `<username>/<username>`.
          3. Set `profile.username` in `.github/profile-signal.yml`.
          4. Commit and push.
          5. Run **Actions → Profile Signal → Run workflow**.

          Installed files include `.profile-signal/`, the config, the workflow, install notes, and a version marker. The archive does not overwrite your README.

          To upgrade, replace `.profile-signal/` with the runtime from the new release and review the diff before committing.
          MD

          cat > docs/wiki/Configuration.md <<'MD'
          # Configuration

          [English](Configuration) | [日本語](Configuration-ja)

          Main file: `.github/profile-signal.yml`

          ```yaml
          version: 1
          profile:
            username: YOUR_GITHUB_USERNAME
            timezone: Asia/Tokyo
          privacy:
            public_only: true
          preset: standard
          theme: signal
          widgets: {}
          readme:
            path: README.md
            auto_insert_markers: true
            insert_before: ""
            empty_disabled: true
          ```

          `privacy.public_only: true` is required in v0. Explicit widget settings override the selected preset.
          MD

          cat > docs/wiki/Presets.md <<'MD'
          # Presets

          [English](Presets) | [日本語](Presets-ja)

          Built-in presets: `minimal`, `standard`, `full`, `terminal`, `compact`, `developer`, `activity`, `oss`.

          Presets are YAML files under `.profile-signal/presets/`. Existing preset meanings are kept backward-compatible; new layouts should normally use a new preset ID. User widget overrides always take precedence.
          MD

          cat > docs/wiki/License.md <<'MD'
          # License

          [English](License) | [日本語](License-ja)

          Profile Signal is released under the MIT License. See the repository [LICENSE](https://github.com/mizzz-ivr/profile-signal/blob/main/LICENSE).
          MD

          cat > docs/wiki/_Sidebar.md <<'MD'
          ### English
          - [Home](Home)
          - [Installation](Installation)
          - [Configuration](Configuration)
          - [Presets](Presets)
          - [License](License)

          ### 日本語
          - [ホーム](Home-ja)
          - [導入](Installation-ja)
          - [設定](Configuration-ja)
          - [Preset](Presets-ja)
          - [ライセンス](License-ja)
          MD

          for page in Home Installation Configuration Presets License; do
            tmp="$(mktemp)"
            printf '[English](%s) | [日本語](%s-ja)\n\n' "$page" "$page" > "$tmp"
            cat "docs/wiki/${page}-ja.md" >> "$tmp"
            mv "$tmp" "docs/wiki/${page}-ja.md"
          done

          cat > .gitignore <<'EOF'
          dist/
          __pycache__/
          *.pyc
          .pytest_cache/
          EOF

          rm -rf _source

      - name: Commit non-workflow migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .profile-signal distribution docs release-notes scripts tests README.md README.ja.md LICENSE .gitignore
          git commit -m "feat: migrate Profile Signal OSS source [skip ci]"
          git push origin HEAD:feat/standalone-oss-migration
