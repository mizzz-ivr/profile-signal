name: Profile Signal stream

on:
  schedule:
    - cron: "7,37 * * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-signal-stream
  cancel-in-progress: true

jobs:
  refresh-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2

      - name: Refresh live-facing Profile Signal widgets
        env:
          PROFILE_SIGNAL_CONFIG: .github/profile-signal.yml
        run: python .profile-signal/src/stream_runtime.py

      - name: Commit live signal changes
        shell: bash
        run: |
          set -euo pipefail

          paths=(README.md data/profile-signal-state.json)
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "No live signal changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "chore(profile): refresh latest signals [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing onto latest main"
            git fetch origin main
            git rebase origin/main
          done

          echo "Failed to push latest signals after 3 attempts" >&2
          exit 1
