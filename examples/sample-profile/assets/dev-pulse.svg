<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">Sample seven day development pulse</title>
  <desc id="desc">Static sample chart showing seven days of public development activity.</desc>
  <rect width="960" height="220" rx="16" fill="#0d1117"/>
  <text x="32" y="38" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">DEV PULSE // SAMPLE</text>
  <text x="32" y="62" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">static documentation data · not live GitHub activity</text>
  <line x1="58" y1="174" x2="918" y2="174" stroke="#30363d" stroke-width="1"/>
  <g fill="#2f81f7">
    <rect x="80" y="126" width="72" height="48" rx="6"/>
    <rect x="198" y="94" width="72" height="80" rx="6"/>
    <rect x="316" y="112" width="72" height="62" rx="6"/>
    <rect x="434" y="68" width="72" height="106" rx="6"/>
    <rect x="552" y="84" width="72" height="90" rx="6"/>
    <rect x="670" y="50" width="72" height="124" rx="6"/>
    <rect x="788" y="78" width="72" height="96" rx="6"/>
  </g>
  <g fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">
    <text x="116" y="198">MON</text>
    <text x="234" y="198">TUE</text>
    <text x="352" y="198">WED</text>
    <text x="470" y="198">THU</text>
    <text x="588" y="198">FRI</text>
    <text x="706" y="198">SAT</text>
    <text x="824" y="198">SUN</text>
  </g>
</svg>
